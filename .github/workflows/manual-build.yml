name: Manual builds

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  machomerger-macos:
    name: MachOMerger (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build release executable
        run: swift build --package-path vendor/MachOMerger -c release
      - name: Upload MachOMerger
        uses: actions/upload-artifact@v4
        with:
          name: MachOMerger-macos-arm64
          path: vendor/MachOMerger/.build/release/MachOMerger

  machomerger-windows:
    name: MachOMerger (Windows)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift for Windows
        uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.2-release
          swift-build: 6.2-RELEASE
      - name: Resolve and patch SwiftMachO for Windows
        shell: pwsh
        run: |
          swift package resolve --package-path vendor/MachOMerger
          ./scripts/patch_swiftmacho_windows.ps1
      - name: Build release executable
        shell: pwsh
        run: swift build --package-path vendor/MachOMerger -c release
      - name: Upload MachOMerger
        uses: actions/upload-artifact@v4
        with:
          name: MachOMerger-windows-x86_64
          path: vendor/MachOMerger/.build/release/MachOMerger.exe

  python-wheel:
    name: Python wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: coldhook-wheel
          path: dist/*.whl
