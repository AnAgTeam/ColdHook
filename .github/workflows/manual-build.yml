name: Manual builds

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  machomerger-macos:
    name: MachOMerger (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build release executable
        run: swift build --package-path vendor/MachOMerger -c release
      - name: Upload MachOMerger
        uses: actions/upload-artifact@v4
        with:
          name: MachOMerger-macos-arm64
          path: vendor/MachOMerger/.build/release/MachOMerger

  machomerger-windows:
    name: MachOMerger (Windows)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift for Windows
        uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.2-release
          swift-build: 6.2-RELEASE
      - name: Resolve and patch SwiftMachO for Windows
        shell: pwsh
        run: |
          swift package resolve --package-path vendor/MachOMerger
          ./scripts/patch_swiftmacho_windows.ps1
      - name: Build release executable
        shell: pwsh
        run: swift build --package-path vendor/MachOMerger -c release
      - name: Bundle Swift runtime DLLs
        shell: pwsh
        run: |
          $stage = "windows-artifact"
          New-Item -ItemType Directory -Force $stage | Out-Null
          $exe = Join-Path $stage "MachOMerger.exe"
          Copy-Item vendor/MachOMerger/.build/release/MachOMerger.exe $exe
          $swiftBin = Split-Path (Get-Command swift).Source
          $swiftRoot = Split-Path $swiftBin
          $searchRoots = @($swiftRoot, (Split-Path $swiftRoot), "$env:LOCALAPPDATA\Programs\Swift", "$env:RUNNER_TOOL_CACHE\Swift") | Where-Object { Test-Path $_ }
          $dllIndex = @{}
          Get-ChildItem $searchRoots -Filter *.dll -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object {
            if (-not $dllIndex.ContainsKey($_.Name.ToLowerInvariant())) { $dllIndex[$_.Name.ToLowerInvariant()] = $_.FullName }
          }
          $foundation = Get-ChildItem $searchRoots -Filter Foundation.dll -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $foundation) { throw "Foundation.dll not found in Swift toolchain" }
          Get-ChildItem $foundation.Directory.FullName -Filter *.dll -File | ForEach-Object {
            Copy-Item $_.FullName (Join-Path $stage $_.Name) -Force
          }
          $dumpbin = (Get-ChildItem "$env:ProgramFiles\Microsoft Visual Studio\2022" -Filter dumpbin.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if (-not $dumpbin) { throw "dumpbin.exe not found" }
          $queue = [System.Collections.Generic.Queue[string]]::new()
          $queue.Enqueue($exe)
          Get-ChildItem $stage -Filter *.dll -File | ForEach-Object { $queue.Enqueue($_.FullName) }
          $seen = [System.Collections.Generic.HashSet[string]]::new()
          while ($queue.Count -gt 0) {
            $current = $queue.Dequeue()
            if (-not $seen.Add($current)) { continue }
            $deps = & $dumpbin /DEPENDENTS $current 2>$null
            foreach ($match in ($deps | Select-String -Pattern '([A-Za-z0-9_.-]+\.dll)')) {
              $name = $match.Matches[0].Groups[1].Value
              $candidate = $dllIndex[$name.ToLowerInvariant()]
              if ($candidate) {
                $dest = Join-Path $stage $name
                if (-not (Test-Path $dest)) { Copy-Item $candidate $dest }
                $queue.Enqueue($candidate)
              }
            }
          }
          Write-Host "Bundled DLLs:"
          Get-ChildItem $stage -Filter *.dll | ForEach-Object { Write-Host "  $($_.Name)" }
      - name: Upload MachOMerger
        uses: actions/upload-artifact@v4
        with:
          name: MachOMerger-windows-x86_64
          path: windows-artifact/

  python-wheel:
    name: Python wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: coldhook-wheel
          path: dist/*.whl
