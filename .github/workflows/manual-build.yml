name: Manual builds

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  machomerger-macos:
    name: MachOMerger (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build release executable
        run: swift build --package-path vendor/MachOMerger -c release
      - name: Upload MachOMerger
        uses: actions/upload-artifact@v4
        with:
          name: MachOMerger-macos-arm64
          path: vendor/MachOMerger/.build/release/MachOMerger

  machomerger-windows:
    name: MachOMerger (Windows)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift for Windows
        uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.2-release
          swift-build: 6.2-RELEASE
      - name: Resolve and patch SwiftMachO for Windows
        shell: pwsh
        run: |
          swift package resolve --package-path vendor/MachOMerger
          ./scripts/patch_swiftmacho_windows.ps1
      - name: Build release executable
        shell: pwsh
        run: swift build --package-path vendor/MachOMerger -c release
      - name: Bundle Swift runtime DLLs
        shell: pwsh
        run: |
          $stage = "windows-artifact"
          New-Item -ItemType Directory -Force $stage | Out-Null
          $exe = Join-Path $stage "MachOMerger.exe"
          Copy-Item vendor/MachOMerger/.build/release/MachOMerger.exe $exe
          $swiftBin = Split-Path (Get-Command swift).Source
          $dumpbin = (Get-ChildItem "$env:ProgramFiles\Microsoft Visual Studio\2022" -Filter dumpbin.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if (-not $dumpbin) { throw "dumpbin.exe not found" }
          $queue = [System.Collections.Generic.Queue[string]]::new()
          $queue.Enqueue($exe)
          $seen = [System.Collections.Generic.HashSet[string]]::new()
          while ($queue.Count -gt 0) {
            $current = $queue.Dequeue()
            if (-not $seen.Add($current)) { continue }
            $deps = & $dumpbin /DEPENDENTS $current 2>$null
            foreach ($match in ($deps | Select-String -Pattern '^\s+([A-Za-z0-9_.-]+\.dll)\s*$')) {
              $name = $match.Matches[0].Groups[1].Value
              $candidate = Join-Path $swiftBin $name
              if (Test-Path $candidate) {
                $dest = Join-Path $stage $name
                if (-not (Test-Path $dest)) { Copy-Item $candidate $dest }
                $queue.Enqueue($candidate)
              }
            }
          }
          Compress-Archive -Path "$stage\*" -DestinationPath "MachOMerger-windows-x86_64.zip" -CompressionLevel Optimal
      - name: Upload MachOMerger
        uses: actions/upload-artifact@v4
        with:
          name: MachOMerger-windows-x86_64
          path: MachOMerger-windows-x86_64.zip

  python-wheel:
    name: Python wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: coldhook-wheel
          path: dist/*.whl
