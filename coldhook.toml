# Пример конфига ColdHook. Пути — относительно каталога этого файла.
#
# Запуск:
#   1) собрать движок:   (cd vendor/MachOMerger && swift build -c release)
#   2) собрать таргет:    python3 harness/macos/run.py   # создаёт build/libtarget.dylib
#   3) пропатчить:        python3 -m coldhook patch -c coldhook.toml

[signing]
identity = "-"          # adhoc; для боевого — имя серта или use_ldid = true под TrollStore
# entitlements = "..."
# use_ldid = false

# Демонстрационный таргет — локальный харнесс. Для разных dylib просто добавляй
# новые [[target]] с своими binary/sources.
[[target]]
name = "demo"
binary = "harness/macos/build/libtarget.dylib"
sources = [
  "harness/macos/hook.c",
  "harness/macos/orig_stubs.S",
]
out = "harness/macos/build/libtarget.coldhook.dylib"
