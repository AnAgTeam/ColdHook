[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "coldhook"
version = "0.1.0"
description = "ColdHook static Mach-O hook tooling"
requires-python = ">=3.11"
dependencies = ["lief>=0.17"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
coldhook-logos = "coldhook.logos_prepass:main"

[tool.setuptools]
packages = ["coldhook"]

[tool.setuptools.package-data]
coldhook = [
  "templates/**/*",
  "include/*",
  "runtime/*",
  "substrate/**/*",
]
